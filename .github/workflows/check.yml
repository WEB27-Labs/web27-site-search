name: Source and browser checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, simplexml
          coverage: none
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check.py --browser
      - run: python scripts/build.py /tmp/web27-site-search.zip
      - uses: actions/upload-artifact@v4
        with:
          name: web27-site-search-installation
          path: /tmp/web27-site-search.zip
          if-no-files-found: error
